apiVersion: apps/v1
kind: Deployment

metadata:
  name: dashboard-api
  namespace: applications

  labels:
    app: dashboard-api
    app.kubernetes.io/name: dashboard-api
    app.kubernetes.io/component: dashboard
    app.kubernetes.io/part-of: order-fulfillment-platform

spec:
  replicas: 2

  selector:
    matchLabels:
      app: dashboard-api

  template:
    metadata:
      labels:
        app: dashboard-api
        app.kubernetes.io/name: dashboard-api
        app.kubernetes.io/component: dashboard
        app.kubernetes.io/part-of: order-fulfillment-platform

    spec:
      serviceAccountName: dashboard-api

      containers:
        - name: dashboard-api
          image: REPLACE_WITH_ECR/dashboard-api:latest
          imagePullPolicy: IfNotPresent

          ports:
            - name: http
              containerPort: 8086
              protocol: TCP

          env:
            - name: PORT
              value: "8086"

            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: dashboard-api-secrets
                  key: DATABASE_URL

          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /livez
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3

          resources:
            requests:
              cpu: 100m
              memory: 128Mi

            limits:
              cpu: 500m
              memory: 512Mi

      tolerations:
        - key: workload-type
          operator: Equal
          value: application
          effect: NoSchedule