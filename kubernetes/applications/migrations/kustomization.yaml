apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - job.yaml

configMapGenerator:
  - name: db-migrations
    namespace: data
    files:
      - 001_init.sql=sql/001_init.sql

generatorOptions:
  disableNameSuffixHash: true
  # ConfigMap must be a Sync hook like the Job, otherwise Argo applies the
  # Job first and the pod cannot mount db-migrations.
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
