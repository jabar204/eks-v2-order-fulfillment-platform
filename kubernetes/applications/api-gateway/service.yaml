apiVersion: v1
kind: Service

metadata:
  name: api-gateway
  namespace: applications

  labels:
    app.kubernetes.io/name: api-gateway
    app.kubernetes.io/component: gateway
    app.kubernetes.io/part-of: order-fulfillment-platform

spec:
  type: ClusterIP

  selector:
    app: api-gateway

  ports:
    - name: http
      port: 8080
      targetPort: 8080
      protocol: TCP