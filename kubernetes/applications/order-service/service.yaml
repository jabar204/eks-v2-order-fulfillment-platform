apiVersion: v1
kind: Service

metadata:
  name: order-service
  namespace: applications

  labels:
    app.kubernetes.io/name: order-service
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: order-fulfillment-platform

spec:
  type: ClusterIP

  selector:
    app: order-service

  ports:
    - name: http
      port: 8081
      targetPort: 8081
      protocol: TCP