apiVersion: apps/v1
kind: Deployment

metadata:
  name: order-service
  namespace: applications

  labels:
    app: order-service
    app.kubernetes.io/name: order-service
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: order-fulfillment-platform

spec:
  replicas: 2

  selector:
    matchLabels:
      app: order-service

  template:
    metadata:
      labels:
        app: order-service
        app.kubernetes.io/name: order-service
        app.kubernetes.io/component: backend
        app.kubernetes.io/part-of: order-fulfillment-platform

    spec:
      serviceAccountName: order-service

      containers:
        - name: order-service
          image: REPLACE_WITH_ECR/order-service:latest
          imagePullPolicy: IfNotPresent

          ports:
            - name: http
              containerPort: 8081
              protocol: TCP

          env:
            - name: PORT
              value: "8081"

            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: order-service-secrets
                  key: DATABASE_URL

            - name: SQS_QUEUE_URL
              value: https://sqs.eu-west-2.amazonaws.com/283434716298/eks-v2-dev-order-events

          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /livez
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3

          resources:
            requests:
              cpu: 100m
              memory: 128Mi

            limits:
              cpu: 500m
              memory: 512Mi

      tolerations:
        - key: workload-type
          operator: Equal
          value: application
          effect: NoSchedule
