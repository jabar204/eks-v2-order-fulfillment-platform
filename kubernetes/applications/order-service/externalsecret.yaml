apiVersion: external-secrets.io/v1
kind: ExternalSecret

metadata:
  name: order-service
  namespace: applications

spec:
  refreshInterval: 1h

  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore

  target:
    name: order-service-secrets
    creationPolicy: Owner

  data:
    - secretKey: DATABASE_URL
      remoteRef:
        key: eks-v2-dev/database/url
