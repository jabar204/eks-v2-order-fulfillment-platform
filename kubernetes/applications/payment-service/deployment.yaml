apiVersion: apps/v1
kind: Deployment

metadata:
  name: payment-service
  namespace: applications

  labels:
    app: payment-service
    app.kubernetes.io/name: payment-service
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: order-fulfillment-platform

spec:
  replicas: 2

  selector:
    matchLabels:
      app: payment-service

  template:
    metadata:
      labels:
        app: payment-service
        app.kubernetes.io/name: payment-service
        app.kubernetes.io/component: backend
        app.kubernetes.io/part-of: order-fulfillment-platform

    spec:
      serviceAccountName: payment-service

      containers:
        - name: payment-service
          image: REPLACE_WITH_ECR/payment-service:latest
          imagePullPolicy: IfNotPresent

          ports:
            - name: http
              containerPort: 8083
              protocol: TCP

          env:
            - name: PORT
              value: "8083"

            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: payment-service-secrets
                  key: DATABASE_URL

            - name: SQS_QUEUE_URL
              value: REPLACE_AFTER_TERRAFORM_APPLY

          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /livez
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3

          resources:
            requests:
              cpu: 100m
              memory: 128Mi

            limits:
              cpu: 500m
              memory: 512Mi

      tolerations:
        - key: workload-type
          operator: Equal
          value: application
          effect: NoSchedule