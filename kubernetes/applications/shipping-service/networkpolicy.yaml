apiVersion: networking.k8s.io/v1
kind: NetworkPolicy

metadata:
  name: shipping-service
  namespace: applications

spec:
  podSelector:
    matchLabels:
      app: shipping-service

  policyTypes:
    - Ingress
    - Egress

  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: api-gateway
      ports:
        - protocol: TCP
          port: 8085

  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: data
      ports:
        - protocol: TCP
          port: 5432

    - to:
        - namespaceSelector: {}
      ports:
        - protocol: UDP
          port: 53

        - protocol: TCP
          port: 53