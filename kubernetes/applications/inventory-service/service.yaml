apiVersion: v1
kind: Service

metadata:
  name: inventory-service
  namespace: applications

  labels:
    app.kubernetes.io/name: inventory-service
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: order-fulfillment-platform

spec:
  type: ClusterIP

  selector:
    app: inventory-service

  ports:
    - name: http
      port: 8082
      targetPort: 8082
      protocol: TCP