apiVersion: karpenter.k8s.aws/v1
kind: EC2NodeClass

metadata:
  name: default

spec:
  amiFamily: AL2023

  amiSelectorTerms:
    - alias: al2023@latest

  subnetSelectorTerms:
    - tags:
        karpenter.sh/discovery: eks-v2-dev-cluster

  securityGroupSelectorTerms:
    - tags:
        karpenter.sh/discovery: eks-v2-dev-cluster

  instanceProfile: eks-v2-dev-karpenter-node-profile

  metadataOptions:
    httpEndpoint: enabled
    httpProtocolIPv6: disabled
    httpPutResponseHopLimit: 1
    httpTokens: required

  blockDeviceMappings:
    - deviceName: /dev/xvda

      ebs:
        volumeType: gp3
        volumeSize: 50Gi
        encrypted: true
        deleteOnTermination: true

  tags:
    Name: eks-v2-dev-karpenter-node

    Project: eks-v2
    Environment: dev
    ManagedBy: Karpenter

    karpenter.sh/discovery: eks-v2-dev-cluster