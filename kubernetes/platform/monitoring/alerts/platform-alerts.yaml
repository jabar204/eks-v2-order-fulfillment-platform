apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule

metadata:
  name: order-fulfillment-platform
  namespace: monitoring

  labels:
    app.kubernetes.io/part-of: order-fulfillment-platform
    release: monitoring

spec:
  groups:
    - name: workloads
      rules:
        - alert: PodCrashLooping
          expr: |
            max by (namespace, pod, container) (
              increase(kube_pod_container_status_restarts_total[15m])
            ) > 3
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Pod {{ $labels.namespace }}/{{ $labels.pod }} is crash looping"
            description: "Container {{ $labels.container }} restarted more than 3 times in 15m."

        - alert: DeploymentReplicasUnavailable
          expr: |
            (
              kube_deployment_status_replicas_unavailable{namespace="applications"}
            ) > 0
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "Deployment {{ $labels.deployment }} has unavailable replicas"
            description: "{{ $value }} unavailable replicas in applications namespace."

        - alert: HighCPU
          expr: |
            avg by (namespace, pod) (
              rate(container_cpu_usage_seconds_total{namespace="applications", container!=""}[5m])
            ) > 0.8
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "High CPU on {{ $labels.namespace }}/{{ $labels.pod }}"
            description: "Pod CPU usage above 80% for 10 minutes."

    - name: data-plane
      rules:
        - alert: PostgresUnavailable
          expr: |
            kube_statefulset_status_replicas_ready{namespace="data", statefulset="postgres"} < 1
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: "PostgreSQL StatefulSet is not ready"
            description: "No ready postgres replicas in the data namespace."

        - alert: RedisUnavailable
          expr: |
            kube_statefulset_status_replicas_ready{namespace="data", statefulset="redis"} < 1
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: "Redis StatefulSet is not ready"
            description: "No ready redis replicas in the data namespace."

    - name: worker
      rules:
        - alert: WorkerQueueBacklog
          expr: |
            kube_deployment_status_replicas_available{namespace="applications", deployment="worker"} < 1
            and on() (
              max(kube_horizontalpodautoscaler_status_desired_replicas{namespace="applications", horizontalpodautoscaler="keda-hpa-worker"}) > 1
            )
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "Worker scaling pressure / possible SQS backlog"
            description: "KEDA wants more worker replicas while availability is low — investigate SQS depth and worker health."
