# Bootstrap entrypoint. Apply once after Argo CD is installed:
#   kubectl apply -f kubernetes/platform/argocd/root-application.yaml
#
# Argo CD then syncs this folder (App-of-Apps) and manages the child apps.

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: eks-v2-platform
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: platform

  source:
    # Replace with your real remote when pushing
    repoURL: https://github.com/jabar204/eks-v2-order-fulfillment-platform.git
    targetRevision: main
    path: kubernetes/platform/argocd

  destination:
    server: https://kubernetes.default.svc
    namespace: argocd

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
