apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: platform

spec:
  project: platform

  source:
    repoURL: https://github.com/jabar204/eks-v2-order-fulfillment-platform.git
    targetRevision: main
    path: kubernetes/platform

  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system

  syncPolicy:
    automated:
      prune: true
      selfHeal: true