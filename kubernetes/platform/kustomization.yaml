apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Pure Kubernetes manifests synced by the Argo CD "platform" Application.
# Helm charts (Traefik, cert-manager, KEDA operator, kube-prometheus-stack, etc.)
# are installed during bootstrap using their values.yaml files.

resources:
  - storage
  - metrics-server
  - postgres
  - redis
  - external-secrets
  # monitoring/alerts require Prometheus Operator CRDs — applied after
  # kube-prometheus-stack Helm install (see platform/monitoring/README.md).
