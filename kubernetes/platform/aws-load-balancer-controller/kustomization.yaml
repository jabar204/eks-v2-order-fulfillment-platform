clusterName: eks-v2-dev-cluster

region: eu-west-2

vpcId: vpc-0104ccb441649f51c

replicaCount: 2

serviceAccount:
  create: true
  name: aws-load-balancer-controller

  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::283434716298:role/eks-v2-dev-aws-load-balancer-controller-role

resources:
  requests:
    cpu: 200m
    memory: 256Mi

  limits:
    cpu: 500m
    memory: 512Mi

nodeSelector:
  role: system

priorityClassName: system-cluster-critical

podDisruptionBudget:
  maxUnavailable: 1

affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100

        podAffinityTerm:
          topologyKey: kubernetes.io/hostname

          labelSelector:
            matchLabels:
              app.kubernetes.io/name: aws-load-balancer-controller