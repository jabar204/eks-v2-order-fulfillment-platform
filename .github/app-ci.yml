name: Application CI

on:
  pull_request:
    paths:
      - "services/**"
      - "kubernetes/**"
      - ".github/workflows/app-ci.yml"

  push:
    branches:
      - main
    paths:
      - "services/**"
      - "kubernetes/**"
      - ".github/workflows/app-ci.yml"

permissions:
  contents: read

jobs:
  go-test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        service:
          - api-gateway
          - order-service
          - inventory-service
          - payment-service
          - notification-service
          - shipping-service
          - worker
          - scheduler
          - dashboard-api

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Download dependencies
        working-directory: services/${{ matrix.service }}
        run: go mod download

      - name: Run tests
        working-directory: services/${{ matrix.service }}
        run: go test ./...

      - name: Run vet
        working-directory: services/${{ matrix.service }}
        run: go vet ./...

  docker-build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        service:
          - api-gateway
          - order-service
          - inventory-service
          - payment-service
          - notification-service
          - shipping-service
          - worker
          - scheduler
          - dashboard-api

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build image
        run: |
          docker build \
            -t ${{ matrix.service }}:ci \
            services/${{ matrix.service }}

  kustomize:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4

      - name: Validate application manifests
        run: |
          for dir in kubernetes/applications/*; do
            if [ -d "$dir" ]; then
              echo "Validating $dir"
              kubectl kustomize "$dir" > /dev/null
            fi
          done

      - name: Validate Argo CD manifests
        run: |
          kubectl kustomize kubernetes/platform/argocd > /dev/null
          kubectl kustomize kubernetes/platform/argocd/applications > /dev/null