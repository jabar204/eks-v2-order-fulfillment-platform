name: Application CI

on:
  workflow_dispatch:

  pull_request:
    paths:
      - "services/**"
      - "kubernetes/**"
      - ".golangci.yml"
      - ".github/workflows/app-ci.yml"

  push:
    branches:
      - main
    paths:
      - "services/**"
      - "kubernetes/**"
      - ".golangci.yml"
      - ".github/workflows/app-ci.yml"

permissions:
  contents: read

jobs:
  go-test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        service:
          - api-gateway
          - order-service
          - inventory-service
          - payment-service
          - notification-service
          - shipping-service
          - worker
          - scheduler
          - dashboard-api

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.22"
          cache-dependency-path: services/${{ matrix.service }}/go.sum

      - name: Download dependencies
        working-directory: services/${{ matrix.service }}
        run: go mod download

      - name: Run tests
        working-directory: services/${{ matrix.service }}
        run: go test ./...

      - name: Run vet
        working-directory: services/${{ matrix.service }}
        run: go vet ./...

      - name: Run golangci-lint
        # v6 matches golangci-lint v1.x; v7+ requires golangci-lint v2
        uses: golangci/golangci-lint-action@v6
        with:
          version: v1.61.0
          working-directory: services/${{ matrix.service }}
          args: --config=${{ github.workspace }}/.golangci.yml

  hadolint:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        service:
          - api-gateway
          - order-service
          - inventory-service
          - payment-service
          - notification-service
          - shipping-service
          - worker
          - scheduler
          - dashboard-api

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Lint Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: services/${{ matrix.service }}/Dockerfile
          # Soft gate: report Dockerfile smells without blocking CI on provided images
          failure-threshold: error
        continue-on-error: true

  docker-build:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        service:
          - api-gateway
          - order-service
          - inventory-service
          - payment-service
          - notification-service
          - shipping-service
          - worker
          - scheduler
          - dashboard-api

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Build image
        working-directory: services/${{ matrix.service }}
        run: |
          docker build -t "${{ matrix.service }}:ci" -f Dockerfile .

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: "${{ matrix.service }}:ci"
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL
          vuln-type: os,library
        # Soft gate: still publish the CRITICAL report in CI logs without blocking on base/stdlib CVEs
        continue-on-error: true

  kustomize:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4

      - name: Validate application manifests
        run: |
          shopt -s nullglob
          for dir in kubernetes/applications/*/; do
            if [ -f "${dir}kustomization.yaml" ] || [ -f "${dir}kustomization.yml" ]; then
              echo "Validating $dir"
              kubectl kustomize "$dir" > /dev/null
            else
              echo "Skipping $dir (no kustomization.yaml)"
            fi
          done

      - name: Validate GitOps overlay and Argo CD
        run: |
          kubectl kustomize kubernetes/overlays/dev > /dev/null
          kubectl kustomize kubernetes/platform > /dev/null
          kubectl kustomize kubernetes/platform/argocd > /dev/null
          kubectl kustomize kubernetes/platform/argocd/applications > /dev/null
          kubectl kustomize kubernetes/platform/keda > /dev/null
          kubectl kustomize kubernetes/platform/monitoring > /dev/null
          kubectl kustomize kubernetes/platform/hardening > /dev/null
