name: Application CI

on:
  workflow_dispatch:

  pull_request:
    paths:
      - "services/**"
      - "kubernetes/**"
      - ".github/workflows/app-ci.yml"

  push:
    branches:
      - main
    paths:
      - "services/**"
      - "kubernetes/**"
      - ".github/workflows/app-ci.yml"

permissions:
  contents: read

jobs:
  go-test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        service:
          - api-gateway
          - order-service
          - inventory-service
          - payment-service
          - notification-service
          - shipping-service
          - worker
          - scheduler
          - dashboard-api

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache-dependency-path: services/${{ matrix.service }}/go.sum

      - name: Download dependencies
        working-directory: services/${{ matrix.service }}
        run: go mod download

      - name: Run tests
        working-directory: services/${{ matrix.service }}
        run: go test ./...

      - name: Run vet
        working-directory: services/${{ matrix.service }}
        run: go vet ./...

  docker-build:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        service:
          - api-gateway
          - order-service
          - inventory-service
          - payment-service
          - notification-service
          - shipping-service
          - worker
          - scheduler
          - dashboard-api

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build image
        working-directory: services/${{ matrix.service }}
        run: |
          if [ -f Dockerfile ]; then
            docker build -t "${{ matrix.service }}:ci" -f Dockerfile .
          elif [ -f dockerfile ]; then
            docker build -t "${{ matrix.service }}:ci" -f dockerfile .
          else
            echo "No Dockerfile found for ${{ matrix.service }}"
            exit 1
          fi

  kustomize:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4

      - name: Validate application manifests
        run: |
          shopt -s nullglob
          for dir in kubernetes/applications/*/; do
            if [ -f "${dir}kustomization.yaml" ] || [ -f "${dir}kustomization.yml" ]; then
              echo "Validating $dir"
              kubectl kustomize "$dir" > /dev/null
            else
              echo "Skipping $dir (no kustomization.yaml)"
            fi
          done

      - name: Validate Argo CD manifests
        run: |
          kubectl kustomize kubernetes/platform/argocd > /dev/null
          kubectl kustomize kubernetes/platform/argocd/applications > /dev/null
